<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="-1" />
  <meta name="cache-control" content="no-cache, no-store, must-revalidate" />
  <meta name="apple-mobile-web-app-cache" content="no" />
  <meta name="mobile-web-app-cache" content="no" />
  <meta name="theme-color" content="#1a6b5a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Consulta de Turnos</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231a6b5a'/><text x='16' y='22' font-size='18' text-anchor='middle' fill='white'>T</text></svg>" />
  <script src="js/turnos-boot-cache.js?v=20260520c"></script>
  <style>
    /* ── RESET Y BASE ─────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-primary:   #1a6b5a;
      --color-primary-d: #134d41;
      --color-accent:    #e8f5f1;
      --color-bg:        #f4f7f6;
      --color-surface:   #ffffff;
      --color-border:    #d0ddd9;
      --color-text:      #1e2d29;
      --color-text-muted:#5a7268;
      --color-nl:        #c5cdd8;
      --color-nl-head:   #5b6778;
      --color-nl-text:   #1a2332;
      --color-orange:    #ff9800;        /* día marcado / ausente — naranja fuerte */
      --color-orange-border: #e65100;
      --color-orange-text: #4e1800;
      --color-sum:       #e8f5f1;        /* columna Σ */
      --color-sum-head:  #1a6b5a;
      --color-err:       #c0392b;
      --color-warn:      #e67e22;
      --color-ok:        #27ae60;
      --radius:          6px;
      --shadow:          0 2px 8px rgba(0,0,0,.10);
      --font:            'Segoe UI', system-ui, sans-serif;
      --sticky-w1:       140px;
      --sticky-w2:       58px;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    body {
      font-family: var(--font);
      font-size: 13px;
      background: var(--color-bg);
      color: var(--color-text);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    /* contenedores top: no se encojen */
    .page-header, .toolbar, .status-bar { flex: 0 0 auto; }
    /* área inferior con scroll */
    .sheet-outer { flex: 1 1 auto; min-height: 0; }

    /* ── HEADER ───────────────────────────────────────────────────────────── */
    .page-header {
      background: var(--color-primary);
      color: #fff;
      padding: 14px 20px 10px;
      box-shadow: var(--shadow);
    }
    .page-header h1 { font-size: 20px; font-weight: 700; letter-spacing: .3px; }
    .page-header p  { font-size: 11.5px; opacity: .85; margin-top: 3px; max-width: 820px; line-height: 1.5; }

    /* ── TOOLBAR ──────────────────────────────────────────────────────────── */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    .toolbar label { font-weight: 600; font-size: 12px; color: var(--color-text-muted); }
    .toolbar input[type="month"] {
      padding: 5px 10px;
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius);
      font-size: 13px;
      font-family: var(--font);
      background: var(--color-surface);
      color: var(--color-text);
    }
    .btn {
      padding: 6px 14px;
      border: none;
      border-radius: var(--radius);
      font-size: 12.5px;
      font-family: var(--font);
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, opacity .15s;
      white-space: nowrap;
      touch-action: manipulation;
    }
    .btn:hover { opacity: .88; }
    .btn-primary  { background: var(--color-primary); color: #fff; }
    .btn-secondary{ background: var(--color-accent);  color: var(--color-primary-d); border: 1.5px solid var(--color-border); }
    .btn-ghost    { background: transparent; color: var(--color-primary); border: 1.5px solid var(--color-primary); }

    /* status */
    .status-bar {
      flex: 0 0 auto;
      padding: 4px 20px;
      font-size: 12px;
      min-height: 28px;
      line-height: 1.35;
      background: var(--color-bg);
      border-bottom: 0;
      margin: 0;
      box-sizing: border-box;
    }
    .status-bar:empty { visibility: hidden; }
    .status-bar.ok   { color: var(--color-ok);   background: #eafaf1; }
    .status-bar.err  { color: var(--color-err);  background: #fdecea; }
    .status-bar.warn { color: var(--color-warn); background: #fef9ec; }

    /* ── SHEET WRAPPER ────────────────────────────────────────────────────── */
    .sheet-outer {
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    #sheetWrap {
      flex: 1 1 auto;
      min-height: 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .sheet-scroll {
      flex: 1 1 auto;
      min-height: 0;
      min-width: 0;
      width: 100%;
      overflow-x: auto;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      scroll-behavior: auto;
    }
    .page-legend-mobile {
      display: none;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .page-legend-mobile .leg {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      line-height: 1.2;
    }
    .page-legend-mobile .leg-aseo { background: #e1bee7; color: #4a148c; border: 1px solid #7b1fa2; }
    .page-legend-mobile .leg-cocina { background: #bbdefb; color: #0d47a1; border: 1px solid #1565c0; }
    .page-legend-mobile .leg-basura { background: #c8e6c9; color: #1b5e20; border: 1px solid #2e7d32; }
    .page-legend-mobile .leg-ajuste { background: #fff9c4; color: #795548; border: 1px solid #fbc02d; }

    /* ── TABLE ────────────────────────────────────────────────────────────── */
    .sheet-table {
      border-collapse: separate;
      border-spacing: 0;
      font-size: 12px;
      min-width: max-content;
      white-space: nowrap;
    }

    /* columna nombre fija al scroll horizontal */
    .sticky-left, .sticky-corner-thead {
      position: sticky;
      left: 0;
      z-index: 20;
      background: var(--color-surface);
    }
    .sticky-left {
      z-index: 18;
      min-width: var(--sticky-w1);
      max-width: var(--sticky-w1);
      width: var(--sticky-w1);
      box-shadow: 4px 0 6px -2px rgba(0, 0, 0, 0.12);
    }
    .sticky-corner-thead {
      z-index: 45;
      min-width: var(--sticky-w1);
      max-width: var(--sticky-w1);
      width: var(--sticky-w1);
      box-shadow: 4px 0 6px -2px rgba(0, 0, 0, 0.15);
    }
    .he-head {
      min-width: var(--sticky-w2);
      max-width: var(--sticky-w2);
      width: var(--sticky-w2);
    }
    .he-cell {
      min-width: var(--sticky-w2);
      max-width: var(--sticky-w2);
      width: var(--sticky-w2);
      text-align: center;
      background: #f9fbfb;
      border-right: 1.5px solid var(--color-border);
    }

    /* thead */
    thead th {
      background: var(--color-primary);
      color: #fff;
      font-weight: 700;
      text-align: center;
      padding: 5px 4px;
      border-right: 1px solid rgba(255,255,255,.15);
      border-bottom: 2px solid var(--color-primary-d);
      position: sticky;
      top: 0; /* sticky dentro de .sheet-scroll */
      z-index: 30;
    }
    thead .sticky-corner-thead {
      z-index: 45;
      background: var(--color-primary);
      color: #fff;
      text-align: left;
      padding-left: 10px;
      font-size: 11px;
    }
    thead .he-head {
      background: var(--color-primary);
      color: #fff;
      font-size: 11px;
      text-align: center;
    }

    .day-head { min-width: 38px; padding: 3px 2px; }
    .day-head.nl {
      background: var(--color-nl-head) !important;
      color: #fff !important;
      opacity: 1;
    }
    .day-head.nl .dh-num { color: #fff; }
    .day-head.nl .dh-dow-sm,
    .day-head.nl .dow-long { opacity: 1; color: #e2e8f0; }
    .day-head.nl .dh-tag { background: rgba(255,255,255,.35); color: #fff; opacity: 1; }
    .dh-num  { font-size: 13px; font-weight: 800; }
    .dh-dow-sm { font-size: 9px; opacity: .8; }
    .dow-long  { font-size: 8px; opacity: .65; }
    .dh-tag  { font-size: 8px; background: rgba(255,255,255,.25); padding: 1px 3px; border-radius: 3px; }

    .week-sum-head {
      background: var(--color-sum-head);
      min-width: 32px;
      font-size: 11px;
      border-left: 2px solid rgba(255,255,255,.3);
    }

    /* tbody general */
    tbody td, tbody th {
      border-right: 1px solid var(--color-border);
      border-bottom: 1px solid var(--color-border);
      padding: 2px 3px;
      text-align: center;
      vertical-align: middle;
    }
    tbody tr:hover td, tbody tr:hover th { filter: brightness(0.98); }

    /* equipos — colores de fondo por grupo */
    .team-mensajeros td,
    .team-mensajeros th.he-cell { background: #e3f2fd; }
    .team-mensajeros th.emp-name,
    tbody .team-mensajeros th.sticky-left.emp-name { background: #bbdefb; color: #0d47a1; border-right-color: #1976d2; }

    .team-2 td,
    .team-2 th.he-cell { background: #f3e5f5; }
    .team-2 th.emp-name,
    tbody .team-2 th.sticky-left.emp-name { background: #e1bee7; color: #4a148c; border-right-color: #7b1fa2; }

    .team-3 td,
    .team-3 th.he-cell { background: #e0f7fa; }
    .team-3 th.emp-name,
    tbody .team-3 th.sticky-left.emp-name { background: #b2ebf2; color: #006064; border-right-color: #00838f; }

    .team-4 td,
    .team-4 th.he-cell { background: #fff8e1; }
    .team-4 th.emp-name,
    tbody .team-4 th.sticky-left.emp-name { background: #ffecb3; color: #e65100; border-right-color: #f57c00; }

    .team-5 td,
    .team-5 th.he-cell { background: #fce4ec; }
    .team-5 th.emp-name,
    tbody .team-5 th.sticky-left.emp-name { background: #f8bbd0; color: #880e4f; border-right-color: #c2185b; }

    .team-6 td,
    .team-6 th.he-cell { background: #e8f5e9; }
    .team-6 th.emp-name,
    tbody .team-6 th.sticky-left.emp-name { background: #c8e6c9; color: #1b5e20; border-right-color: #388e3c; }

    /* nombre empleado (sin equipo) */
    .emp-name {
      background: var(--color-accent);
      font-weight: 700;
      font-size: 11px;
      text-align: left;
      padding-left: 8px;
      color: var(--color-primary-d);
      border-right: 2px solid var(--color-primary);
    }
    /* Nombre en columna fija: en escritorio una línea */
    .emp-name-stack { display: inline; white-space: nowrap; }
    .emp-nombre,
    .emp-apellido {
      display: inline;
      font-size: inherit;
      line-height: inherit;
      font-weight: inherit;
      opacity: 1;
    }
    .emp-nombre::after { content: ' '; }
    .row-lbl {
      font-size: 10px;
      color: var(--color-text-muted);
      font-weight: 600;
      text-align: right;
      padding-right: 4px;
      background: #f9fbfb;
    }

    tbody tr:not([class*="team-"]) .sticky-left.emp-name { background: var(--color-accent); z-index: 19; }
    tbody tr[class*="team-"] th.sticky-left.emp-name { z-index: 19; }
    .he-lbl  { display: block; font-size: 9px; color: var(--color-text-muted); }
    .he-val  { display: block; font-size: 13px; font-weight: 800; color: var(--color-primary); }

  /* celdas no laborables (domingo / festivo) */
    td.nl, th.nl,
    .team-mensajeros td.nl,
    .team-2 td.nl,
    .team-3 td.nl,
    .team-4 td.nl,
    .team-5 td.nl,
    .team-6 td.nl {
      background: var(--color-nl) !important;
      color: var(--color-nl-text) !important;
      font-size: 11px;
      font-weight: 700;
      opacity: 1;
    }

    /* celda marcada naranja */
    /* celda marcada naranja (ausente / entrada 0) */
    .celda-dia-marcado-naranja,
    td.celda-dia-marcado-naranja {
      background: var(--color-orange) !important;
      box-shadow: inset 0 0 0 2px var(--color-orange-border) !important;
    }
    td.celda-dia-marcado-naranja .cell-in,
    td.celda-dia-marcado-naranja .cell-readonly,
    td.celda-dia-marcado-naranja .cell-in-lunch {
      background: #ffb74d !important;
      color: var(--color-orange-text) !important;
      font-weight: 700;
    }
    td.lunch-cell.celda-dia-marcado-naranja {
      background: var(--color-orange) !important;
      box-shadow: inset 0 0 0 2px var(--color-orange-border) !important;
    }
    td.lunch-cell.celda-dia-marcado-naranja .lunch-time-txt {
      color: var(--color-orange-text) !important;
      font-weight: 700;
    }

    /* ajuste: entrada 10 o salida 5 */
    td.celda-ajuste-hora {
      background: #fff9c4 !important;
    }
    td.celda-ajuste-hora .cell-in {
      background: #fff59d;
      font-weight: 700;
    }

    /* aseo recepción 9:00 */
    td.celda-aseo-recepcion {
      background: #e1bee7 !important;
      box-shadow: inset 0 0 0 2px #7b1fa2;
      padding: 1px 2px !important;
      text-align: center;
      vertical-align: middle;
    }
    td.celda-aseo-recepcion .celda-aseo-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      width: 100%;
      box-sizing: border-box;
    }
    td.celda-aseo-recepcion .aseo-in-label {
      display: block;
      font-size: 7px;
      font-weight: 800;
      color: #6a1b9a;
      line-height: 1;
      pointer-events: none;
      user-select: none;
    }
    td.celda-aseo-recepcion .cell-in {
      background: #ce93d8;
      font-weight: 800;
      color: #4a148c;
      width: 26px;
      margin: 0;
    }

    td.celda-cocina-recepcion {
      background: #bbdefb !important;
      box-shadow: inset 0 0 0 2px #1565c0;
      padding: 1px 2px !important;
      text-align: center;
      vertical-align: middle;
    }
    td.celda-cocina-recepcion .celda-cocina-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      width: 100%;
      box-sizing: border-box;
    }
    td.celda-cocina-recepcion .cocina-in-label {
      display: block;
      font-size: 7px;
      font-weight: 800;
      color: #0d47a1;
      line-height: 1;
      pointer-events: none;
      user-select: none;
    }
    td.celda-cocina-recepcion .cell-in {
      background: #90caf9;
      font-weight: 800;
      color: #0d47a1;
      width: 26px;
      margin: 0;
    }

    /* sacada de basura 18:00 (lun, mié, vie) */
    td.celda-sacada-basura {
      background: #c8e6c9 !important;
      box-shadow: inset 0 0 0 2px #2e7d32;
      padding: 1px 2px !important;
      text-align: center;
      vertical-align: middle;
    }
    td.celda-sacada-basura .celda-basura-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      width: 100%;
      box-sizing: border-box;
    }
    td.celda-sacada-basura .basura-in-label {
      display: block;
      font-size: 7px;
      font-weight: 800;
      color: #1b5e20;
      line-height: 1;
      pointer-events: none;
      user-select: none;
    }
    td.celda-sacada-basura .cell-in {
      background: #a5d6a7;
      font-weight: 800;
      color: #1b5e20;
      width: 26px;
      margin: 0;
    }

    /* inputs am/pm */
    .cell-in {
      width: 28px;
      padding: 2px 1px;
      border: 1px solid transparent;
      border-radius: 3px;
      font-size: 12px;
      font-family: var(--font);
      text-align: center;
      background: transparent;
      color: var(--color-text);
      transition: border-color .12s, background .12s;
    }
    .cell-in:focus {
      outline: none;
      border-color: var(--color-primary);
      background: var(--color-accent);
    }

    /* almuerzo */
    .lunch-cell { font-size: 11px; color: var(--color-text-muted); }
    .lunch-time-txt { font-weight: 600; }
    .cell-readonly {
      display: inline-block;
      min-width: 1.5rem;
      font-weight: 600;
      text-align: center;
      user-select: none;
      cursor: default;
    }
    body.modo-consulta .page-header { background: #37474f; }
    .cell-in-lunch {
      width: 36px;
      font-weight: 600;
      text-align: center;
    }
    td.lunch-cell .cell-in-lunch:focus {
      background: var(--color-accent);
    }
    .lunch-row-hdr { text-align: right; padding-right: 4px; }
    .lunch-hdr-lbl  { font-weight: 700; }
    .lunch-hdr-trio-note, .lunch-hdr-time { font-size: 9px; color: var(--color-text-muted); margin-left: 2px; }

    /* columna Σ */
    .week-sum-cell {
      background: var(--color-sum);
      font-weight: 800;
      font-size: 12px;
      color: var(--color-primary-d);
      border-left: 2px solid var(--color-border);
      min-width: 32px;
    }
    .week-sum-placeholder { background: var(--color-sum); }

    /* separador entre empleados */
    tr.spacer td { height: 5px; background: var(--color-bg); border: none; }

    /* ── BACK LINK ────────────────────────────────────────────────────────── */
    .back-link {
      position: fixed;
      top: 12px;
      right: 18px;
      background: rgba(255,255,255,.2);
      color: #fff;
      border: 1px solid rgba(255,255,255,.4);
      border-radius: var(--radius);
      padding: 5px 12px;
      font-size: 12px;
      text-decoration: none;
      font-weight: 600;
      z-index: 100;
      transition: background .15s;
    }
    .back-link:hover { background: rgba(255,255,255,.35); }

    /* ── RESPONSIVE / MÓVIL ───────────────────────────────────────────────── */
    @media (max-width: 768px) {
      :root {
        --sticky-w1: 5.25rem;
        --sticky-w2: 2.65rem;
        --sheet-top: calc(10.5rem + env(safe-area-inset-top, 0px));
      }
      html { height: 100%; }
      .sheet-outer {
        flex: 1 1 0;
        min-height: 0;
        overflow: hidden;
      }
      #sheetWrap {
        flex: 1 1 0;
        min-height: 0;
        height: 0;
        overflow: hidden;
      }
      .sheet-scroll {
        flex: 1 1 auto;
        min-height: 240px;
        height: calc(100dvh - var(--sheet-top) - env(safe-area-inset-bottom, 0px));
        max-height: none;
      }
      .page-header {
        padding: max(10px, env(safe-area-inset-top, 0px)) 52px 8px 12px;
      }
      .page-header h1 { font-size: clamp(1rem, 4.2vw, 1.2rem); }
      .page-header p.page-desc-long { display: none; }
      .page-legend-mobile { display: flex; }
      .back-link {
        top: max(10px, env(safe-area-inset-top, 0px));
        right: max(8px, env(safe-area-inset-right, 0px));
        padding: 8px 10px;
        min-height: 40px;
        display: inline-flex;
        align-items: center;
      }
      .toolbar {
        padding: 8px 10px;
        gap: 6px;
      }
      .toolbar label { width: 100%; }
      .toolbar input[type="month"] {
        width: 100%;
        min-height: 44px;
        font-size: 16px;
      }
      .toolbar .btn {
        flex: 1 1 calc(50% - 4px);
        min-height: 44px;
        padding: 10px 8px;
        font-size: 11px;
      }
      .status-bar { padding: 6px 10px; font-size: 11px; }
      .sheet-table { font-size: 11px; }
      .day-head { min-width: 2rem; padding: 2px 1px !important; }
      .dow-long { display: none; }
      .dh-num { font-size: 11px; }
      .dh-dow-sm { font-size: 8px; }
      .week-sum-head, .week-sum-cell { min-width: 1.65rem; font-size: 10px; }
      th.emp-name,
      th.sticky-left.emp-name {
        line-height: 1 !important;
        padding: 1px 3px 1px 4px !important;
        word-break: normal;
        hyphens: none;
        white-space: normal;
        overflow: hidden;
      }
      .emp-name-stack {
        display: inline-flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        gap: 0;
        line-height: 1;
        max-width: 100%;
        white-space: normal;
      }
      .emp-nombre,
      .emp-apellido {
        display: block;
        max-width: 100%;
        overflow: hidden;
